[package]
name = "poprako-orchestra"
version = "0.4.0"
edition = "2024"
description = "A unified transaction abstraction framework for Rust — decoupled Oper, Step, Nucl, and Run traits"
license = "MIT"
repository = "https://github.com/poprako-dev/poprako-orchestra"
documentation = "https://docs.rs/poprako-orchestra"
readme = "README.md"
keywords = ["transaction", "abstraction", "async", "trait", "framework"]
categories = ["asynchronous", "rust-patterns"]

[features]
macro = ["dep:poprako-orchestra-macro"]
oper_ext = []

[dependencies]
poprako-orchestra-macro = { version = "0.2.3", path = "poprako_orchestra_macro", optional = true }

[dev-dependencies]
trybuild = "1"
